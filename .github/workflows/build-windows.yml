name: Build Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Clean Windows
        run: Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
      - name: Recreate Windows
        run: flutter create --platforms=windows .
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AnimeSlayer-Desktop-Windows
          path: build/windows/x64/runner/Release/
